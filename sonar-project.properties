sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.organization=${SONAR_ORGANIZATION}
sonar.host.url=${SONAR_HOST_URL}
sonar.token=${SONAR_TOKEN}

# Permitir la ejecución manual junto con la automática
sonar.scanner.force=true

# Path to source directories
sonar.sources=src
sonar.tests=src

# Inclusiones de tests
sonar.test.inclusions=**/__tests__/**/*.test.js
sonar.test.exclusions=

# Exclusiones solo para node_modules, no excluir los tests
sonar.exclusions=node_modules/**
sonar.coverage.exclusions=node_modules/**

# Asegurar que se analicen todos los archivos
sonar.javascript.file.suffixes=.js
sonar.javascript.filepattern=**/*.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Unique analysis identifier
sonar.projectVersion=1.0.0
sonar.working.directory=.scannerwork
